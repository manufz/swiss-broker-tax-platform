name: Deploy reviewed image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azure-dev-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: azure-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the committed digest and verify readiness
        run: |
          set -euo pipefail
          test -n "$APP_NAME" && test -n "$RESOURCE_GROUP" && test -n "$ACR_NAME"
          digest=$(python3 scripts/image_digest.py)
          registry=$(az acr show --name "$ACR_NAME" --subscription "$SUBSCRIPTION" --query loginServer -o tsv)
          az acr repository show --name "$ACR_NAME" --image "swiss-tax-statement-api@$digest" --output none
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --image "$registry/swiss-tax-statement-api@$digest" --output none
          ready=false
          for _ in {1..60}; do
            state=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --query '[properties.latestRevisionName,properties.latestReadyRevisionName]' -o tsv)
            read -r latest ready_revision <<< "${state//$'\n'/ }"
            if [[ -n "$latest" && "$latest" == "$ready_revision" ]]; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          health=$(az containerapp revision show -n "$APP_NAME" -g "$RESOURCE_GROUP" --revision "$latest" --subscription "$SUBSCRIPTION" --query properties.healthState -o tsv)
          test "$health" = Healthy
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --query properties.configuration.ingress.fqdn -o tsv)
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://$fqdn/docs")" = 401
          test "$(curl -sS -X POST -o /dev/null -w '%{http_code}' "https://$fqdn/v1/statements")" = 401
          echo "Healthy revision: $latest; deployed committed digest: $digest" >> "$GITHUB_STEP_SUMMARY"
          echo 'Complete the signed-in upload acceptance check. Run a local Terraform plan to refresh state.' >> "$GITHUB_STEP_SUMMARY"
