name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.16'
      - name: Python checks
        run: |
          uv sync --frozen
          uv run --frozen ruff check app tests scripts
          uv run --frozen ruff format --check app tests scripts
          uv run --frozen python -m pytest -q
          python scripts/audit_publication.py
      - name: Lint GitHub workflows
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -shellcheck=
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.4'
          terraform_wrapper: false
      - name: Terraform checks without Azure access
        run: |
          terraform fmt -check -recursive terraform
          for root in terraform/bootstrap terraform/environments/dev; do
            task_data=$(mktemp -d)
            TF_DATA_DIR="$task_data" terraform -chdir="$root" init -backend=false -lockfile=readonly -input=false
            TF_DATA_DIR="$task_data" terraform -chdir="$root" validate
            rm -rf "$task_data"
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and test Linux runtime
        run: |
          docker buildx build --load --platform linux/amd64 -t swiss-tax-ci .
          bash scripts/docker_smoke.sh swiss-tax-ci
