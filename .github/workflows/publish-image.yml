name: Publish verified image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azure-dev-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: azure-dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.16'
      - name: Test source before publishing
        run: |
          uv sync --frozen
          uv run --frozen ruff check app tests scripts
          uv run --frozen ruff format --check app tests scripts
          uv run --frozen python -m pytest -q
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and test exactly the image that will be pushed
        run: |
          docker buildx build --load --platform linux/amd64 -t swiss-tax-release .
          bash scripts/docker_smoke.sh swiss-tax-release
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish commit tag and record digest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$ACR_NAME"
          az acr login --name "$ACR_NAME" --subscription "$AZURE_SUBSCRIPTION_ID"
          registry=$(az acr show --name "$ACR_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --query loginServer -o tsv)
          if az acr repository show --name "$ACR_NAME" --image "swiss-tax-statement-api:$SOURCE_SHA" --output none 2>/dev/null; then
            echo 'Commit tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          docker tag swiss-tax-release "$registry/swiss-tax-statement-api:$SOURCE_SHA"
          docker push "$registry/swiss-tax-statement-api:$SOURCE_SHA"
          digest=$(az acr repository show --name "$ACR_NAME" --image "swiss-tax-statement-api:$SOURCE_SHA" --query digest -o tsv)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Published source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: $digest" >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit this digest in Terraform before running Deploy reviewed image.' >> "$GITHUB_STEP_SUMMARY"
