name: Inspect OIDC subject
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  subject:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-dev
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Print only the subject for Azure federation
        shell: python
        run: |
          import base64, json, os, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=api%3A%2F%2FAzureADTokenExchange'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          subject = claims['sub']
          assert subject.endswith(':environment:azure-dev')
          print('Azure federation subject:', subject)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Set TF_VAR_github_oidc_subject to: `' + subject + '`\n')
